              - paragraph
              - paragraph [ref=e414]:
                - text: Анимация перехода автоматически достигает своего
                - code [ref=e415]: finished
                - text: состояния, когда завершаются все анимации. Чтобы предотвратить это автоматическое завершение, вскоре можно использовать
                - code [ref=e416]: ViewTranistion.waitUntil
                - text: . При передаче промиса
                - code [ref=e417]: ViewTransition
                - text: достигнет своего
                - code [ref=e418]: finished
                - text: состояния только тогда, когда этот переданный промис также будет разрешен.
              - code [ref=e421]: "const t = document.startViewTransition(…); t.waitUntil(async () => { await fetch(…); });"
              - paragraph [ref=e422]:
