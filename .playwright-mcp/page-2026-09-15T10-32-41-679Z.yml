                - code [ref=e362]: HTMLElement
                - text: .
              - paragraph [ref=e363]: Ограниченные переходы позволяют одновременно запускать несколько переходов между представлениями (при условии, что у них разные корневые элементы перехода). События указателя блокируются только для этого поддерева (которое можно повторно включить), а не для всего документа. Кроме того, они позволяют элементам, находящимся за пределами корневого элемента перехода, отображаться поверх ограниченного перехода между представлениями.
              - paragraph [ref=e364]: В приведенной ниже демонстрации вы можете перемещать точку внутри ее контейнера, нажав одну из кнопок. Это можно сделать с помощью переходов между представлениями, ограниченных областью действия документа, или переходов между представлениями, ограниченных областью действия элемента, что позволяет увидеть, как они ведут себя по-разному.
              - iframe [ref=e365]: См. <a href="https://codepen.io/web-dot-dev/pen/ogjOjyd">переход между режимами просмотра «Область видимости документа» и «Область видимости элемента»</a> .
              - paragraph [ref=e366]:
                - text: Функция готова к тестированию в Chrome 140 с включенным флагом "Экспериментальные функции веб-платформы" в
                - code [ref=e367]: chrome://flags
                - text: . Мы активно ищем отзывы разработчиков.
