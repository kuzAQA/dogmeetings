              - paragraph
              - paragraph [ref=e399]:
                - text: При запуске перехода между представлениями создается экземпляр
                - code [ref=e400]: ViewTransition
                - text: . Этот объект содержит несколько промисов и функциональность для отслеживания хода перехода, а также позволяет выполнять такие действия, как пропуск перехода или изменение его типов.
              - paragraph [ref=e401]:
                - text: Вместо того чтобы заставлять вас вручную отслеживать этот экземпляр, Chrome теперь предоставляет свойство
                - code [ref=e402]: document.activeViewTransition
                - text: ", которое представляет этот объект. Если переход не выполняется, его значение равно"
                - code [ref=e403]: "null"
                - text: .
              - paragraph [ref=e404]:
                - text: При переходах между представлениями в рамках одного документа значение устанавливается при вызове
                - code [ref=e405]: document.startViewTransition
                - text: . При переходах между представлениями в разных документах доступ к экземпляру
                - code [ref=e406]: ViewTransition
                - text: можно получить в событиях
                - code [ref=e407]: pageswap
                - text: и
                - code [ref=e408]: pagereveal
                - text: .
