              - heading "Что дальше?" [level=2] [ref=e425]
              - paragraph [ref=e426]: Как видите, мы не сидели сложа руки с момента первого выпуска View Transitions в 2023 году. Мы с нетерпением ждём возможности выпустить View Transitions с ограниченным охватом в будущем и, как всегда, открыты для обратной связи.
              - paragraph [ref=e427]:
                - text: Если у вас есть вопросы о переходах между представлениями, свяжитесь с нами в социальных сетях. Запросы на добавление функций переходов между представлениями можно
