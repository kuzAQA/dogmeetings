              - paragraph
              - paragraph [ref=e290]:
                - text: При выполнении перехода между представлениями (view transition) элементы, запечатленные в снимке, отображаются в виде дерева псевдоэлементов. По умолчанию сгенерированное дерево является «плоским». Это означает, что исходная иерархия в DOM теряется, и все захваченные группы переходов между представлениями являются соседними элементами под одним псевдоэлементом
                - code [ref=e291]: ::view-transition
                - text: .
              - paragraph [ref=e292]: Такой подход с плоским деревом достаточен для многих случаев, но становится проблематичным при использовании визуальных эффектов, таких как обрезка или 3D-преобразования. Для этого требуется определенная иерархия в дереве.
              - figure "Запись демонстрации без и с включенными группами переходов между вложенными представлениями. При использовании групп переходов между вложенными представлениями текстовое содержимое может оставаться обрезанным карточкой, а также вращаться в 3D вместе с карточкой." [ref=e293]
              - paragraph [ref=e296]:
                - text: Благодаря функции
                - link "\"Вложенные группы переходов представления\"" [ref=e297] [cursor=pointer]:
                  - /url: https://developer.chrome.com/docs/css-ui/view-transitions/nested-view-transition-groups?hl=ru
                - text: теперь можно вкладывать псевдоэлементы
                - code [ref=e298]: ::view-transition-group
                - text: друг в друга. При вложенности групп переходов представления можно восстановить такие эффекты, как обрезка во время перехода.
              - paragraph [ref=e299]:
                - link "Узнайте, как использовать группы переходов между представлениями." [ref=e300] [cursor=pointer]:
                  - /url: https://developer.chrome.com/docs/css-ui/view-transitions/nested-view-transition-groups?hl=ru
              - heading "Теперь псевдоэлементы наследуют больше свойств анимации." [level=3] [ref=e301]
              - paragraph [ref=e302]:
                - text: Когда вы задаете одно из свойств
                - code [ref=e303]: animation-*
                - text: в псевдообъекте
                - code [ref=e304]: ::view-transition-group(…)
                - text: ", содержащиеся в нем"
                - code [ref=e305]: ::view-transition-image-pair(…)
                - text: ","
                - code [ref=e306]: ::view-transition-old(…)
                - text: и
                - code [ref=e307]: ::view-transition-new(…)
                - text: также наследуют это свойство. Это удобно, поскольку автоматически синхронизирует плавный переход между
                - code [ref=e308]: ::view-transition-new(…)
                - text: и
                - code [ref=e309]: ::view-transition-old(…)
                - text: с
                - code [ref=e310]: ::view-transition-group(…)
                - text: .
              - code [ref=e313]: "::view-transition-group(.card) { animation-duration: 0.5s; }"
              - paragraph [ref=e314]:
                - text: Первоначально это наследование ограничивалось параметрами
                - code [ref=e315]: animation-duration
                - text: и
                - code [ref=e316]: animation-fill-mode
                - text: (а позже и
                - code [ref=e317]: animation-delay
                - text: ), но теперь оно расширено и включает в себя наследование большего количества параметров анимации.
              - paragraph [ref=e318]:
                - text: Теперь браузеры, поддерживающие переходы между представлениями, должны иметь в
                - link "своей таблице стилей user-gent" [ref=e319] [cursor=pointer]:
                  - /url: https://developer.mozilla.org/docs/Web/CSS/CSS_cascade/Cascade#user-agent_stylesheets
                - text: следующее.
              - code [ref=e322]: ":root::view-transition-image-pair(*), :root::view-transition-old(*), :root::view-transition-new(*) { animation-duration: inherit; animation-fill-mode: inherit; animation-delay: inherit; animation-timing-function: inherit; animation-iteration-count: inherit; animation-direction: inherit; animation-play-state: inherit; }"
              - complementary [ref=e323]:
                - strong [ref=e324]: "Примечание:"
                - text: Вам не нужно добавлять этот код самостоятельно, поскольку таблица стилей user-agent — это таблица стилей, которая поставляется вместе с браузером и задает документам их базовое оформление.
              - paragraph [ref=e325]:
                - link "Псевдоэлементы, наследующие больше свойств," [ref=e326] [cursor=pointer]:
                  - /url: https://chromestatus.com/feature/5154752085884928
                - text: появились в Chrome 140.
              - heading [level=3] [ref=e327]:
                - text: Выполнение функции обратного вызова
                - code [ref=e328]: finished
                - text: промиса больше не ожидает кадра.
              - paragraph [ref=e329]:
                - text: При использовании промиса
                - code [ref=e330]: finished
                - text: для выполнения функции обратного вызова Chrome раньше ждал создания кадра, прежде чем выполнять эту логику. Это могло вызвать мерцание в конце анимации, когда скрипт перемещал некоторые стили, пытаясь сохранить визуально похожее состояние.
              - code [ref=e333]: "document.startViewTransition(() => { if (from) { dfrom.classList.remove(\"shadow\"); dto.appendChild(target); } else { dto.classList.remove(\"shadow\"); dfrom.appendChild(target); } }).finished.then(() => { if (from) { dto.classList.add(\"shadow\"); } else { dfrom.classList.add(\"shadow\"); } from = 1 - from; });"
              - figure "Запись работы предыдущего кода, сделанная в Chrome 139, которая не включает исправление синхронизации. Можно заметить сбой, когда тень блока добавляется после завершения перехода." [ref=e334]
              - paragraph [ref=e337]:
                - text: Это изменение во времени исправляет ситуацию, перемещая
                - link "этапы очистки перехода между представлениями" [ref=e338] [cursor=pointer]:
                  - /url: https://www.w3.org/TR/css-view-transitions-1/#handle-transition-frame-algorithm
                - text: на асинхронное выполнение после завершения жизненного цикла. Это гарантирует, что визуальный кадр, созданный после
                - code [ref=e339]: finished
                - text: разрешения промиса, по-прежнему будет сохранять структуру перехода между представлениями, тем самым избегая мерцания.
              - paragraph [ref=e340]:
                - text: Это
                - link "изменение времени выполнения" [ref=e341] [cursor=pointer]:
                  - /url: https://chromestatus.com/feature/5143135809961984
                - text: было включено в Chrome 140.
